name: Perbarui HMA

on:
  schedule:
    # Setiap hari pukul 08:17 WIB (01:17 UTC)
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ambil HMA dari ESDM
        run: node scripts/update-hma.mjs
      - name: Commit bila ada perubahan
        run: |
          if git diff --quiet hma.json; then
            echo "Tidak ada perubahan HMA."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hma.json
          git commit -m "Perbarui HMA otomatis dari ESDM"
          git push
